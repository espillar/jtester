<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hierarchical Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="input-area">
            <input type="text" id="card-text-input" placeholder="Enter card text...">
            <button id="add-card-button">Add Card</button>
            <button id="copy-card-button">Copy Selected</button>
            <button id="paste-card-button">Paste Cached Card</button>
            <button id="delete-card-button">Delete Selected</button>
            <button id="save-board-button">Save Board</button>
            <!-- File input for loading -->
            <input type="file" id="load-board-input" accept=".json" style="display: none;">
            <label for="load-board-input" id="load-board-label" class="button-like-label">Load Board</label>
    <button id="clear-storage-button">Clear Saved Data</button> <!-- New Button -->
        </div>
        <div class="columns-container">
            <div id="column-1" class="column">
                <h2>Column 1</h2>
                <!-- Cards for column 1 will go here -->
            </div>
            <div id="column-2" class="column">
                <h2>Column 2</h2>
                <!-- Cards for column 2 will go here -->
            </div>
            <div id="column-3" class="column">
                <h2>Column 3</h2>
                <!-- Cards for column 3 will go here -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
